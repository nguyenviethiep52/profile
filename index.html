        }

        }

            display: block;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            margin: 20px auto;
            border: 3px solid #2563eb;
        }

        p, li {
            font-size: 17px;
            line-height: 1.8;
        }

</head>
